name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: apt-repo
  cancel-in-progress: false

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION
        run: |
          v=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' bin/free-storage)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match VERSION=$v"; exit 1; }

      - name: Build .deb
        run: packaging/build-deb.sh

      - name: Install and smoke test
        run: |
          sudo apt-get install -y ./dist/*.deb
          free-storage --version
          free-storage --dry-run --root "$RUNNER_TEMP"

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "APT_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >>"$GITHUB_ENV"

      - name: Publish apt repo to gh-pages
        env:
          APT_KEY_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages; then
            git worktree add site origin/gh-pages
            git -C site switch -c gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi
          packaging/update-apt-repo.sh site dist/*.deb
          git -C site add -A
          git -C site commit -m "apt: publish $GITHUB_REF_NAME"
          git -C site push origin gh-pages
